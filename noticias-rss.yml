name: RSS News Updates

on:
  schedule:
    - cron: '0 7 * * *'   # 9:00 CEST (UTC+2) = 7:00 UTC - Mañana
    - cron: '0 15 * * *'  # 17:00 CEST (UTC+2) = 15:00 UTC - Tarde
  workflow_dispatch:       # Permite ejecución manual desde GitHub UI

jobs:
  update-noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip

      - name: Run actualizar_noticias.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
        run: python3 actualizar_noticias.py
