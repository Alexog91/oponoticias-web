    <text x="556" y="502" font-size="14" font-weight="400" fill="#ffffff" fill-opacity="0.48">opositores activos</text>
    <line x1="742" y1="438" x2="742" y2="502" stroke="white" stroke-opacity="0.14" stroke-width="1"/>
    <text x="770" y="476" font-size="58" font-weight="900" fill="#ffffff" letter-spacing="-2">100k+</text>
    <text x="770" y="502" font-size="14" font-weight="400" fill="#ffffff" fill-opacity="0.48">plazas al año</text>
    <line x1="980" y1="438" x2="980" y2="502" stroke="white" stroke-opacity="0.14" stroke-width="1"/>
    <text x="1008" y="476" font-size="58" font-weight="900" fill="#ffffff" letter-spacing="-2">L–S</text>
