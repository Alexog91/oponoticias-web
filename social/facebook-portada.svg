    <line x1="840" y1="0" x2="840" y2="624"/><line x1="960" y1="0" x2="960" y2="624"/>
    <line x1="1080" y1="0" x2="1080" y2="624"/><line x1="1200" y1="0" x2="1200" y2="624"/>
    <line x1="1320" y1="0" x2="1320" y2="624"/><line x1="1440" y1="0" x2="1440" y2="624"/>
