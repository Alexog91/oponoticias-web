    <rect x="46" y="107" width="78" height="7" rx="3.5" fill="#C4A574"/>
    <rect x="61" y="121" width="49" height="6" rx="3"   fill="#ffffff" fill-opacity="0.55"/>
    <rect x="2" y="2" width="166" height="166" rx="36"
