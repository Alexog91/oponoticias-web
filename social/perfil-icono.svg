<svg viewBox="0 0 1024 1024"
     xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="OpoNoticias — foto de perfil">

  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#5A5047"/>
      <stop offset="55%"  stop-color="#9C8A6E"/>
      <stop offset="100%" stop-color="#7A8B6E"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="42%" r="65%">
      <stop offset="60%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.20"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#g)"/>
  <rect width="1024" height="1024" fill="url(#sheen)"/>
  <rect width="1024" height="1024" fill="url(#vig)"/>

  <text x="512" y="582" text-anchor="middle"
        font-family="'Merriweather', Georgia, 'Times New Roman', serif"
        font-size="440" letter-spacing="-28">
    <tspan font-weight="900" fill="#ffffff">O</tspan><tspan font-weight="400" fill="#ffffff">N</tspan>
  </text>

  <rect x="277" y="648" width="470" height="40" rx="20" fill="#C4A574"/>
  <rect x="362" y="720" width="300" height="34" rx="17" fill="#ffffff" fill-opacity="0.55"/>
</svg>
