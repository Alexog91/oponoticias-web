  <circle cx="256" cy="272" r="92" fill="none" stroke="white" stroke-width="48"/>

  <circle cx="374" cy="142" r="50" fill="white"/>
  <circle cx="374" cy="142" r="42" fill="#7A8B6E"/>
  <circle cx="374" cy="142" r="16" fill="white"/>

