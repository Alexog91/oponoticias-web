<svg viewBox="0 0 512 512"
     xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="OpoNoticias — icono 512×512">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#5A5047"/>
      <stop offset="55%"  stop-color="#9C8A6E"/>
      <stop offset="100%" stop-color="#7A8B6E"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.14"/>
    </linearGradient>
    <clipPath id="icon-clip"><rect width="512" height="512" rx="115"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#sh)" clip-path="url(#icon-clip)"/>
  <rect width="512" height="512" fill="url(#dp)" clip-path="url(#icon-clip)"/>

  <!-- Monograma ON (O = Oposiciones, N = Noticias) -->
  <text x="256" y="271" text-anchor="middle"
        font-family="'Merriweather', Georgia, 'Times New Roman', serif"
        font-size="205" letter-spacing="-8">
    <tspan font-weight="900" fill="#ffffff">O</tspan><tspan font-weight="400" fill="#ffffff">N</tspan>
  </text>

  <!-- Filete de cabecera -->
  <rect x="138" y="323" width="236" height="20" rx="10" fill="#C4A574"/>
  <rect x="184" y="364" width="148" height="18" rx="9"  fill="#ffffff" fill-opacity="0.55"/>

  <rect x="2" y="2" width="508" height="508" rx="114"
        fill="none" stroke="white" stroke-opacity="0.10" stroke-width="3"/>
</svg>
