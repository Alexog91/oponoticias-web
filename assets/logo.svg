<svg viewBox="0 0 420 100"
     xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="OpoNoticias — logotipo horizontal">

  <defs>
    <!-- Fondo del isotipo: degradado cálido 135° gris cálido → ocre → verde musgo -->
    <linearGradient id="ibg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#5A5047"/>
      <stop offset="55%"  stop-color="#9C8A6E"/>
      <stop offset="100%" stop-color="#7A8B6E"/>
    </linearGradient>

    <!-- Brillo especular suave -->
    <linearGradient id="sh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ISOTIPO (100 × 100): monograma ON + filete editorial -->
  <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#ibg)"/>
  <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#sh)"/>

  <!-- Monograma ON (O = Oposiciones, N = Noticias) -->
  <text x="50" y="53" text-anchor="middle"
        font-family="'Merriweather', Georgia, 'Times New Roman', serif"
        font-size="40" letter-spacing="-1.5">
    <tspan font-weight="900" fill="#ffffff">O</tspan><tspan font-weight="400" fill="#ffffff">N</tspan>
  </text>

  <!-- Filete de cabecera -->
  <rect x="27" y="63" width="46" height="4"   rx="2"    fill="#C4A574"/>
  <rect x="36" y="71" width="29" height="3.5" rx="1.75" fill="#ffffff" fill-opacity="0.55"/>

  <!-- WORDMARK -->
  <text y="70"
        font-family="'Merriweather', Georgia, 'Times New Roman', serif"
        xml:space="preserve">
    <tspan x="116" font-size="40" font-weight="900" fill="#5A5047" letter-spacing="-1">Opo</tspan><tspan font-size="40" font-weight="400" fill="#2B2622" letter-spacing="-0.5">Noticias</tspan>
  </text>

</svg>
