name: TikTok OAuth (sandbox)

# Intercambia el 'code' de autorización de TikTok por tokens y los guarda en
# Supabase Storage (social/tiktok/tokens.json). Evita tener que usar el terminal.
#
# Uso: Actions → "TikTok OAuth (sandbox)" → Run workflow → pegar el code.
# El code caduca en pocos minutos y es de un solo uso: ejecútalo justo después
# de autorizar en TikTok.
#
# Requiere UN GitHub Secret (valor del SANDBOX, App details → Credentials → Client secret):
#   TIKTOK_SANDBOX_CLIENT_SECRET
# (El client key del sandbox no es secreto y va fijo abajo. SUPABASE ya existen.)
on:
  workflow_dispatch:
    inputs:
      code:
        description: 'Pega aquí el code de la URL de redirección de TikTok'
        required: true

jobs:
  oauth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Intercambiar code por tokens y guardarlos en Supabase
        env:
          TIKTOK_CLIENT_KEY: sbawre9qt8j0j0hvvm   # client key del sandbox (no es secreto)
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_SANDBOX_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
          SUPABASE_STORAGE_BUCKET: social
          TIKTOK_AUTH_CODE: ${{ inputs.code }}
        run: python3 tiktok_oauth_setup.py
