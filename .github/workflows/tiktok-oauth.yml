name: TikTok OAuth (producción)

# Intercambia el 'code' de autorización de TikTok por tokens y los guarda en
# Supabase Storage (private/tiktok/tokens.json). Evita tener que usar el terminal.
#
# Uso: Actions → "TikTok OAuth (producción)" → Run workflow → pegar el code.
# El code caduca en pocos minutos y es de un solo uso: ejecútalo justo después
# de autorizar en TikTok.
#
# Requiere los GitHub Secrets de PRODUCCIÓN (App details → Production → Credentials):
#   TIKTOK_CLIENT_KEY, TIKTOK_CLIENT_SECRET (+ SUPABASE_URL/API_KEY, ya existen).
on:
  workflow_dispatch:
    inputs:
      code:
        description: 'Code de la URL de redirección. DÉJALO VACÍO la primera vez: el workflow te dará el enlace para autorizar.'
        required: false
        default: ''

jobs:
  oauth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Intercambiar code por tokens y guardarlos en Supabase
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
          TIKTOK_AUTH_CODE: ${{ inputs.code }}
        run: python3 tiktok_oauth_setup.py
