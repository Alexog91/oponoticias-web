name: Diagnóstico Meta

# Comprueba el estado del FB_PAGE_TOKEN, la página y la cuenta de Instagram.
# Lanzar manualmente: Actions → "Diagnóstico Meta" → Run workflow.
on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Diagnóstico del token y los IDs de Meta
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_IG_ID: ${{ secrets.FB_IG_ID }}
        run: python3 publicar_meta.py
