name: Generar Blog · Temas

# Genera artículos temáticos (metodología/preparación) como borradores
# programados. NO los publica: de eso se encarga publicar_programados.py
# (job "Generar Blog IA", lunes y jueves), que recoge cualquier borrador vencido.
on:
  schedule:
    - cron: '0 7 * * 3'   # Miércoles 09:00 CEST (UTC+2) = 7:00 UTC
  workflow_dispatch:
    inputs:
      regenerar_n:
        description: 'Regenerar (sobrescribir) los N primeros temas de la lista. Vacío = generar nuevos pendientes.'
        required: false
        default: ''
      regenerar_slugs:
        description: 'Regenerar (sobrescribir) solo estos slugs, separados por comas. Tiene prioridad sobre regenerar_n.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generar-temas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      # rsvg-convert para SVG → PNG (portada del artículo).
      - name: Instalar dependencias de render
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin fonts-dejavu-core

      - name: Instalar Pillow
        continue-on-error: true
        run: pip install -r requirements.txt

      - name: Generar artículos temáticos (borradores)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_STORAGE_BUCKET: social
          REGENERAR_N: ${{ inputs.regenerar_n }}
          REGENERAR_SLUGS: ${{ inputs.regenerar_slugs }}
        run: python3 generar_blog_temas.py

      - name: Subir borradores generados
        run: |
          git config user.name  "OpoNoticias Bot"
          git config user.email "bot@oponoticias.com"
          git add blog/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Sin cambios nuevos que subir."
          else
            git commit -m "Blog: nuevos artículos temáticos (borradores) [skip ci]"
            # Reintenta integrando avances del remoto (evita carrera con otros pushes).
            for intento in 1 2 3; do
              git pull --rebase --autostash origin main || true
              if git push; then echo "push OK"; break; fi
              echo "push rechazado, reintento $intento"; sleep 3
            done
          fi
