name: Revisar emails inválidos (manual)

# Busca suscriptores cuyo DOMINIO no existe o no acepta correo. Son typos al
# apuntarse ("hotmail.comc", "gmial.com"): rebotan CADA envío y SES no siempre
# los mete en su lista de supresión, así que se quedan en bucle para siempre.
#
# Solo LEE y lista. Para borrar uno: workflow "Borrar suscriptor (manual)".

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar MX de cada dominio
        env:
          SUPABASE_URL:     ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, re, json, urllib.request, urllib.parse, collections

          base = os.environ['SUPABASE_URL'].rstrip('/')
          key  = os.environ['SUPABASE_API_KEY']

          def get(path):
              req = urllib.request.Request(f"{base}/rest/v1/{path}", headers={
                  'apikey': key, 'Authorization': f'Bearer {key}'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode())

          # Desglose por estado: cuadra el total de la tabla con los que
          # realmente reciben la newsletter (el motor filtra estado=activo).
          todos = get('suscriptores?select=email,estado,comunidad&limit=5000')
          por_estado = collections.Counter((f.get('estado') or '(vacío)') for f in todos)
          print(f"TOTAL en la tabla: {len(todos)}")
          for estado, n in por_estado.most_common():
              marca = '← reciben la newsletter' if estado == 'activo' else ''
              print(f"  {estado:12} {n:4}  {marca}")

          por_ccaa = collections.Counter(
              (f.get('comunidad') or '(sin comunidad → recibe todas)')
              for f in todos if f.get('estado') == 'activo')
          print("\nActivos por comunidad:")
          for ccaa, n in por_ccaa.most_common():
              print(f"  {ccaa:32} {n:4}")

          filas = [f for f in todos if f.get('estado') == 'activo']
          print(f"\nSuscriptores activos: {len(filas)}")

          por_dominio = collections.defaultdict(list)
          malformados = []
          for f in filas:
              email = (f.get('email') or '').strip().lower()
              if email.count('@') != 1 or ' ' in email:
                  malformados.append(email)
                  continue
              por_dominio[email.split('@')[1]].append(email)
          print(f"Dominios distintos: {len(por_dominio)}")

          def consulta(dominio, tipo):
              """DNS sobre HTTPS (Cloudflare). Devuelve la lista de respuestas."""
              url = ('https://cloudflare-dns.com/dns-query?name='
                     + urllib.parse.quote(dominio) + '&type=' + tipo)
              req = urllib.request.Request(url, headers={'Accept': 'application/dns-json'})
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      d = json.loads(r.read().decode())
              except Exception as e:
                  print(f"  ! {dominio} ({tipo}): {e}")
                  return None                      # error de red: no acusar
              return [a.get('data','') for a in (d.get('Answer') or [])]

          # Un MX puede existir y aun así ser una trampa: los dominios ocupados
          # por squatters suelen apuntar a "localhost" o a una IP privada, de
          # modo que el correo NUNCA se entrega y SES reintenta 14 h antes de
          # rendirse. Pasó con oulook.es (typo de outlook.es) → MX 0 localhost.
          MX_FALSO = re.compile(r'(^|\s)(localhost|127\.0\.0\.1|0\.0\.0\.0|'
                                r'::1|example\.(com|org|net))\.?$', re.I)

          def resuelve(dominio, tipo):
              r = consulta(dominio, tipo)
              return None if r is None else bool(r)

          sospechosos = {}
          for dominio in sorted(por_dominio):
              mx = resuelve(dominio, 'MX')
              if mx is None:
                  continue
              if mx:
                  # Tiene MX, pero ¿apunta a algún sitio real?
                  destinos = consulta(dominio, 'MX') or []
                  if destinos and all(MX_FALSO.search(d) for d in destinos):
                      sospechosos[dominio] = f'MX TRAMPA → {destinos[0]} (nunca entrega)'
                  continue
              # Sin MX: aún podría recibir correo por su registro A (RFC 5321).
              a = resuelve(dominio, 'A')
              if a is False:
                  sospechosos[dominio] = 'el dominio no existe'
              elif a is True:
                  sospechosos[dominio] = 'existe pero no anuncia servidor de correo (MX)'

          print("\n" + "=" * 60)
          if malformados:
              print(f"MALFORMADOS ({len(malformados)}):")
              for e in malformados:
                  print("  ·", e)
          if not sospechosos:
              print("✓ Todos los dominios aceptan correo.")
          else:
              total = sum(len(por_dominio[d]) for d in sospechosos)
              print(f"⚠ {total} suscriptor(es) en {len(sospechosos)} dominio(s) que no reciben correo:")
              for d, motivo in sospechosos.items():
                  print(f"\n  {d} — {motivo}")
                  for e in por_dominio[d]:
                      print("    ·", e)
              print("\nBórralos con el workflow 'Borrar suscriptor (manual)'.")
          PY
