name: Publicar en X — convocatorias de hoy

on:
  workflow_dispatch:

jobs:
  publicar-x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar tweepy
        run: pip install tweepy

      - name: Publicar tweets de hoy
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          python3 - <<'EOF'
          import os, json, re, time, unicodedata, urllib.request, urllib.parse
          import tweepy

          SUPABASE_URL     = os.environ["SUPABASE_URL"]
          SUPABASE_API_KEY = os.environ["SUPABASE_API_KEY"]
          WEB_CONVOCATORIA_DIR = "convocatoria"

          # ── Helpers ────────────────────────────────────────────────────────────

          def limpiar_titulo(titulo):
              titulo = re.sub(r'(?i)resolución\s+de\s+\d+\s+de\s+\w+\s+de\s+\d{4}[^,]*,\s*', '', titulo)
              titulo = re.sub(r'(?i)^(por la que se convoca|por la que se anuncia)\s+', '', titulo)
              titulo = re.sub(r'\s+', ' ', titulo).strip()
              return titulo

          def generar_slug(titulo, ref_boe=""):
              slug = titulo.lower()
              slug = unicodedata.normalize('NFKD', slug)
              slug = ''.join([c for c in slug if not unicodedata.combining(c)])
              slug = re.sub(r'[^a-z0-9]+', '-', slug).strip('-')
              slug = re.sub(r'-+', '-', slug)[:60]
              if ref_boe and ref_boe != "BOE":
                  sufijo = re.sub(r'[^a-z0-9]+', '-', ref_boe.lower()).strip('-')
                  return f"{slug}-{sufijo}.html"
              return f"{slug}.html"

          def ref_boe_desde_enlace(enlace):
              """Extrae 'BOE-A-2026-XXXXX' de la URL del BOE."""
              m = re.search(r'(BOE-[A-Z]-\d{4}-\d+)', enlace or '', re.IGNORECASE)
              return m.group(1).upper() if m else ""

          def url_convocatoria(titulo, enlace):
              ref_boe = ref_boe_desde_enlace(enlace)
              slug    = generar_slug(titulo, ref_boe)
              import os as _os
              if _os.path.exists(f"{WEB_CONVOCATORIA_DIR}/{slug}"):
                  return f"https://oponoticias.com/convocatoria/{slug}"
              return "https://oponoticias.com"

          def formato_tweet(row):
              titulo    = limpiar_titulo(row.get('titulo', ''))
              resumen   = row.get('resumen_claude', '') or ''
              partes    = [p.strip() for p in resumen.split(' - ')]
              plazas    = partes[0] if partes else ""
              puesto    = partes[1] if len(partes) > 1 else ""
              comunidad = row.get('comunidad_autonoma') or ""
              enlace    = row.get('enlace', '')
              url       = url_convocatoria(titulo, enlace)

              ccaa_tags = {
                  "Andalucía": "#Andalucia", "Aragón": "#Aragon",
                  "Asturias": "#Asturias", "Canarias": "#Canarias",
                  "Cantabria": "#Cantabria", "Castilla-La Mancha": "#CastillaLaMancha",
                  "Castilla y León": "#CastillaYLeon", "Cataluña": "#Cataluna",
                  "Ceuta": "#Ceuta", "Extremadura": "#Extremadura",
                  "Galicia": "#Galicia", "Islas Baleares": "#IslasBaleares",
                  "La Rioja": "#LaRioja", "Madrid": "#Madrid",
                  "Melilla": "#Melilla", "Murcia": "#Murcia",
                  "Navarra": "#Navarra", "País Vasco": "#PaisVasco",
                  "Comunitat Valenciana": "#ComunidadValenciana",
              }
              tag_ccaa = ccaa_tags.get(comunidad, "")
              hashtags = f"#oposiciones #BOE {tag_ccaa}".strip()

              lineas = [f"📋 {titulo[:50]}{'…' if len(titulo) > 50 else ''}"]
              if puesto:
                  lineas.append(f"🔢 {plazas} · {puesto[:40]}")
              if comunidad:
                  lineas.append(f"📍 {comunidad}")
              lineas.append(f"\n🔗 {url}")
              lineas.append(
                  "\n📘 https://www.facebook.com/profile.php?id=61590965302457"
                  "  ·  📸 https://www.instagram.com/oponoticiason/"
                  "  ·  ✈️ https://t.me/OPONOTICIAS"
              )
              lineas.append(f"\n{hashtags}")
              return "\n".join(lineas)

          # ── Leer convocatorias de hoy desde Supabase ───────────────────────────

          qs = urllib.parse.urlencode({
              'telegram_enviado': 'eq.true',
              'order': 'id.asc',
              'limit': '100',
          })
          req = urllib.request.Request(
              f"{SUPABASE_URL}/rest/v1/convocatorias?{qs}",
              headers={
                  'apikey': SUPABASE_API_KEY,
                  'Authorization': f'Bearer {SUPABASE_API_KEY}',
                  'Accept': 'application/json',
              }
          )
          with urllib.request.urlopen(req, timeout=15) as r:
              todas = json.loads(r.read())

          # Filtrar las de hoy (fecha contiene el día de hoy en formato RFC 2822)
          from datetime import date
          hoy = date.today()
          hoy_str = hoy.strftime("%-d %b %Y").lower()  # e.g. "16 jun 2026"
          meses = {'jan':'ene','feb':'feb','mar':'mar','apr':'abr','may':'may','jun':'jun',
                   'jul':'jul','aug':'ago','sep':'sep','oct':'oct','nov':'nov','dec':'dic'}
          # también buscar en inglés por si la fecha viene en inglés del RSS
          convs_hoy = [
              r for r in todas
              if hoy.strftime("%d %b %Y").lower() in (r.get('fecha','') or '').lower()
              or hoy_str in (r.get('fecha','') or '').lower()
              or str(hoy) in (r.get('fecha','') or '')
          ]

          # Si el filtro por fecha falla (formato inesperado), usar las últimas N
          if not convs_hoy:
              print("⚠️  No se encontraron registros con fecha de hoy — usando los últimos 50")
              convs_hoy = todas[-50:]

          print(f"📋 Convocatorias a tuitear: {len(convs_hoy)}")

          # ── Publicar en X ──────────────────────────────────────────────────────

          client = tweepy.Client(
              consumer_key=os.environ["X_API_KEY"],
              consumer_secret=os.environ["X_API_SECRET"],
              access_token=os.environ["X_ACCESS_TOKEN"],
              access_token_secret=os.environ["X_ACCESS_SECRET"],
          )

          ok = 0
          for row in convs_hoy:
              try:
                  texto = formato_tweet(row)
                  resp  = client.create_tweet(text=texto)
                  print(f"✅ Tweet {resp.data['id']}: {row.get('titulo','')[:50]}")
                  ok += 1
                  time.sleep(3)   # evitar rate-limit
              except Exception as e:
                  print(f"⚠️  Error: {e} — {row.get('titulo','')[:50]}")

          print(f"\n🎯 Publicados {ok}/{len(convs_hoy)} tweets")
          EOF
