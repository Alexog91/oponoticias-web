name: Daily BOE Check

# Lee el BOE → guarda en Supabase → envía a Telegram → genera las páginas HTML
# → hace commit/push al PROPIO repo (oponoticias-web). Vercel despliega solo.
# Todo en un único repo: scripts + workflows + web juntos.
on:
  schedule:
    # Ejecución principal + 2 de respaldo. Si el BOE no responde a las 7:00
    # (timeout transitorio del RSS), las de las 8:00/9:00 recogen las
    # convocatorias automáticamente — sin intervención manual. NO duplica:
    # el alta da 409 "ya existe" y telegram_ya_enviado evita reenviar a redes,
    # así que una reejecución tras un día ya procesado es un no-op en redes.
    - cron: '0 5 * * 1-6'  # 7:00 CEST (UTC+2) · lunes-sábado (el BOE no publica domingos)
    - cron: '0 6 * * 1-6'  # 8:00 CEST · respaldo si la de las 7:00 falló
    - cron: '0 7 * * 1-6'  # 9:00 CEST · segundo respaldo
  workflow_dispatch:        # Permite ejecución manual desde GitHub UI

permissions:
  contents: write           # Necesario para que leer_boe.py pueda hacer push

jobs:
  check-boe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Renderizador SVG principal del carrusel de Instagram: rsvg-convert
      # (librsvg). Determinista, sin navegador. Chrome queda como respaldo.
      # librsvg (carrusel IG) + ffmpeg y DejaVu Bold (vídeo diario TikTok/Reels).
      - name: Instalar librsvg, ffmpeg y fuentes
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin ffmpeg fonts-dejavu-core

      # Pillow: PNG→JPEG (IG). piper-tts: voz neuronal del vídeo (modelo se
      # descarga bajo demanda). num2words: números a palabras. edge-tts: voz alt.
      - name: Instalar Pillow, piper-tts, edge-tts y num2words
        continue-on-error: true
        run: pip install pillow piper-tts edge-tts num2words

      # Chrome headless como respaldo del renderizador de imágenes.
      # continue-on-error: si falla, el flujo principal (BOE/Telegram) sigue.
      - name: Instalar Chrome
        id: setup-chrome
        continue-on-error: true
        uses: browser-actions/setup-chrome@v1

      # Fuentes de marca (Merriweather + Inter) para que el render coincida con
      # el diseño. Sin esto Chrome usaría fuentes genéricas del sistema.
      - name: Instalar fuentes de marca
        continue-on-error: true
        run: |
          mkdir -p ~/.fonts
          curl -fsSL -o ~/.fonts/Merriweather.ttf \
            "https://github.com/google/fonts/raw/main/ofl/merriweather/Merriweather%5Bopsz,wdth,wght%5D.ttf" || true
          curl -fsSL -o ~/.fonts/Inter.ttf \
            "https://github.com/google/fonts/raw/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf" || true
          fc-cache -f ~/.fonts || true

      # Node + Remotion: render del vídeo diario animado (motion graphics).
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias de Remotion
        continue-on-error: true
        run: cd remotion && npm ci

      - name: Run leer_boe.py
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          INSTAGRAM_WEBHOOK_URL: ${{ secrets.INSTAGRAM_WEBHOOK_URL }}
          VIDEO_WEBHOOK_URL: ${{ secrets.VIDEO_WEBHOOK_URL }}
          # Publicación directa en Meta (Graph API) — reemplaza a Make: gratis, sin límite
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_IG_ID: ${{ secrets.FB_IG_ID }}
          # TikTok Content Posting API — sube como borrador (video.upload scope)
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          SUPABASE_STORAGE_BUCKET: social
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEB_REPO_PATH: '.'
        run: python3 leer_boe.py

      - name: Run generar_ccaa.py
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEB_REPO_PATH: '.'
        run: python3 generar_ccaa.py

      - name: Run generar_categorias.py
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
          WEB_REPO_PATH: '.'
        run: python3 generar_categorias.py

      - name: Commit y push páginas estáticas
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ccaa/ categoria/ sitemap.xml assets/style.css
          git diff --staged --quiet || git commit -m "Actualizar páginas CCAA, categorías y sitemap [skip ci]"
          git pull --no-edit --rebase origin main || true
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/Alexog91/oponoticias-web.git HEAD:main || true
