name: DIAG conteo convocatorias por categoria (temporal)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Contar convocatorias por categoria (exact count via PostgREST)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
        run: |
          for cat in "Educación" "Sanidad" "Justicia" "Seguridad" "Administración" "Hacienda" "Correos" "Técnica"; do
            encoded=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$cat")
            resp=$(curl -s -D - -o /dev/null \
              "$SUPABASE_URL/rest/v1/convocatorias?categoria=eq.$encoded&select=id&limit=1" \
              -H "apikey: $SUPABASE_API_KEY" \
              -H "Authorization: Bearer $SUPABASE_API_KEY" \
              -H "Prefer: count=exact")
            rango=$(echo "$resp" | grep -i "^content-range:" | tr -d '\r')
            echo "$cat -> $rango"
          done
          echo ""
          echo "=== Total tabla convocatorias ==="
          curl -s -D - -o /dev/null \
            "$SUPABASE_URL/rest/v1/convocatorias?select=id&limit=1" \
            -H "apikey: $SUPABASE_API_KEY" \
            -H "Authorization: Bearer $SUPABASE_API_KEY" \
            -H "Prefer: count=exact" | grep -i "^content-range:"
