name: Update Web Only (Sin Anuncios)

# Para actualizar SOLO las páginas estáticas (CCAA, categorías, sitemap)
# SIN hacer anuncios en Telegram, Instagram, Facebook
# Útil para regenerar la web sin duplicar en redes sociales.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run generar_ccaa.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEB_REPO_PATH: '.'
        run: python3 generar_ccaa.py

      - name: Run generar_categorias.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
          WEB_REPO_PATH: '.'
        run: python3 generar_categorias.py

      - name: Run generar_convocatorias_hub.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
          WEB_REPO_PATH: '.'
        run: python3 generar_convocatorias_hub.py

      - name: Commit y push páginas estáticas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ccaa/ categoria/ convocatorias.html sitemap.xml assets/style.css
          git diff --staged --quiet || git commit -m "Actualizar páginas estáticas: CCAA, categorías y sitemap [skip ci]"
          git pull --no-edit --rebase origin main || true
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/Alexog91/oponoticias-web.git HEAD:main || true
