name: Generar Blog IA

on:
  schedule:
    - cron: '0 8 * * 1'   # Lunes 10:00 CEST (UTC+2) = 8:00 UTC
    - cron: '0 8 * * 4'   # Jueves 10:00 CEST - segunda tanda (se auto-limita por categoría)
  workflow_dispatch:       # Permite ejecución manual desde GitHub UI

permissions:
  contents: write          # Necesario para subir los artículos generados

jobs:
  generar-articulos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      # rsvg-convert para SVG → PNG; Chrome para screenshot del artículo.
      - name: Instalar dependencias
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin fonts-dejavu-core google-chrome-stable

      # Pillow convierte PNG → JPEG para Instagram/Facebook.
      - name: Instalar Pillow
        continue-on-error: true
        run: pip install -r requirements.txt

      # Publica primero los borradores cuya fecha ha llegado, luego genera nuevos.
      - name: Publicar borradores programados
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_IG_ID: ${{ secrets.FB_IG_ID }}
          SUPABASE_STORAGE_BUCKET: social
        run: python3 publicar_programados.py

      - name: Generar artículos de blog y publicar en redes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Publicación directa en Meta (Graph API)
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_IG_ID: ${{ secrets.FB_IG_ID }}
          SUPABASE_STORAGE_BUCKET: social
        run: python3 generar_blog.py

      - name: Subir artículos generados
        run: |
          git config user.name  "OpoNoticias Bot"
          git config user.email "bot@oponoticias.com"
          git add blog/ blog.html sitemap-blog.xml 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Sin cambios nuevos que subir."
          else
            git commit -m "Blog IA: nuevos artículos generados [skip ci]"
            # Reintenta integrando avances del remoto (evita carrera con otros pushes).
            for intento in 1 2 3; do
              git pull --rebase --autostash origin main || true
              if git push; then echo "push OK"; break; fi
              echo "push rechazado, reintento $intento"; sleep 3
            done
          fi
