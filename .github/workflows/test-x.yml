name: Test X (Twitter) — Tweet de prueba

on:
  workflow_dispatch:

jobs:
  test-x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar tweepy
        run: pip install tweepy

      - name: Publicar tweet de prueba
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          python3 - <<'EOF'
          import os, tweepy

          client = tweepy.Client(
              consumer_key=os.environ["X_API_KEY"],
              consumer_secret=os.environ["X_API_SECRET"],
              access_token=os.environ["X_ACCESS_TOKEN"],
              access_token_secret=os.environ["X_ACCESS_SECRET"],
          )

          texto = (
              "📋 Auxiliar Administrativo — Ayuntamiento de Madrid [TEST]\n"
              "🔢 5 plazas · Administrativo\n"
              "📍 Madrid\n"
              "\n"
              "🔗 https://oponoticias.com\n"
              "\n"
              "📘 https://www.facebook.com/profile.php?id=61590965302457"
              "  ·  📸 https://www.instagram.com/oponoticiason/"
              "  ·  ✈️ https://t.me/OPONOTICIAS\n"
              "\n"
              "#oposiciones #BOE #Madrid"
          )

          resp = client.create_tweet(text=texto)
          print(f"✅ Tweet de prueba publicado — id: {resp.data['id']}")
          print("⚠️  Recuerda borrarlo manualmente desde @OpoNoticiasON")
          EOF
